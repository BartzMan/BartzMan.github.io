<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Cerroblanco Tree Service</title>
<meta name="description" content="This page is not on the Cerroblanco Tree Service site. Head back to tree trimming, removal and stump grinding in Altamonte Springs, or call (321) 987-2999.">
<meta name="robots" content="noindex">
<link rel="icon" href="https://work.sanketchaukiyal.com/cerroblanco-tree/favicon.svg" type="image/svg+xml">
<style>/* Cerroblanco Tree Service: "Spanish moss" art direction.
   Under the live-oak canopy: moss hangs into every section, photos sit in the logo's hexagon,
   and the climbers' orange rope runs down the page as the one bright accent. */

@font-face{font-family:"Josefin Sans";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/josefin-sans-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Josefin Sans";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/josefin-sans-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Josefin Sans";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/josefin-sans-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Mulish";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/mulish-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Mulish";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/mulish-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Mulish";src:url('https://work.sanketchaukiyal.com/cerroblanco-tree/fonts/mulish-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

:root{
  --olive:#6B7F2E; --olive-d:#4F5E22; --sage:#A9B79A; --sage-l:#C9D1BD;
  --bark:#3B2F25; --bark-d:#241A12; --sky:#CFE6F2; --lime:#F4F1E8; --paper:#FBFAF5;
  --orange:#F2731C; --orange-d:#B9520E;
  --ink:#2A2119; --muted:#5A4E43;
  --pad:clamp(16px,4.2vw,64px); --max:1320px;
  --disp:"Josefin Sans","Avenir Next","Century Gothic",sans-serif;
  --body:"Mulish","Segoe UI",system-ui,sans-serif;
  --grade:saturate(1.08) contrast(1.05) sepia(.06);
  --hexclip:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  --rope:repeating-linear-gradient(155deg,#F2731C 0 5px,#FF9A52 5px 6px,#C4580F 6px 8px);
  --rope-h:repeating-linear-gradient(65deg,#F2731C 0 5px,#FF9A52 5px 6px,#C4580F 6px 8px);
  --hdr:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.62;color:var(--ink);background:var(--lime)}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0;list-style:none}
figure{margin:0}
.page{overflow-x:clip}
.wrap{max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
.brk{overflow-wrap:anywhere}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--orange);color:var(--bark-d);padding:12px 18px;font-family:var(--disp);font-weight:700;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.ic{width:18px;height:18px;flex:none}
.stars{width:86px;height:15px;flex:none}

/* ---------- Spanish moss ---------- */
.moss{position:absolute;left:0;top:0;width:100%;height:clamp(110px,13vw,200px);pointer-events:none;z-index:3;overflow:hidden}
.moss{color:#8E9A80}
.moss-dark{color:#B9C3AC}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
.sw1{animation-duration:9s;animation-delay:-3s}.sw2{animation-duration:6.2s;animation-delay:-1s}
.sw3{animation-duration:8.4s;animation-delay:-5s}.sw4{animation-duration:10s;animation-delay:-2s}.sw5{animation-duration:7.6s;animation-delay:-6s}
@keyframes sway{from{transform:skewX(-3.2deg)}to{transform:skewX(3.4deg)}}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;line-height:1;padding-top:3px;border:2px solid transparent;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,color .25s}
.pill-or{background:var(--orange);color:var(--bark-d);box-shadow:0 0 0 0 var(--bark)}
.pill-or:hover{background:#FF8838;transform:translateY(-3px);box-shadow:0 7px 0 -1px var(--bark)}
.pill:hover .ic{animation:ring .6s ease}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}60%{transform:rotate(12deg)}}
.pill-ghost{border-color:var(--bark);color:var(--bark)}
.pill-ghost:hover{background:var(--bark);color:var(--lime);transform:translateY(-3px)}
.pill-ghost-l{border-color:var(--lime);color:var(--lime)}
.pill-ghost-l:hover{background:var(--lime);color:var(--bark)}

/* ---------- header ---------- */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--hdr);background:var(--bark);color:var(--lime)}
.hdr-in{max-width:1480px;margin:0 auto;height:100%;display:flex;align-items:center;gap:26px;padding:0 var(--pad)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--lime);min-width:0}
.brand-mark{width:40px;height:45px;flex:none;transition:transform .6s}
.brand:hover .brand-mark{transform:rotate(60deg)}
.brand-txt{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand-name{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.24em;text-transform:uppercase;padding-top:3px}
.brand-tag{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin-top:6px;white-space:nowrap}
.nav{margin-left:auto;display:flex;gap:26px}
.nav a{position:relative;font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#E6E1D3;padding:8px 0 6px}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rope-h);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.nav a:hover::after{transform:scaleX(1)}
.hdr-call{min-height:46px;padding:0 20px;font-size:14px}
.burger{display:none;margin-left:auto;width:48px;height:48px;border:0;background:transparent;padding:12px;cursor:pointer}
.burger span{display:block;height:2.5px;background:var(--lime);margin:5px 0;border-radius:2px}
.burger span:nth-child(2){width:70%;margin-left:auto}
.rope-bar{position:absolute;left:0;right:0;bottom:-3px;height:3px;overflow:hidden}
.rope-bar span{display:block;height:100%;background:var(--rope-h);transform-origin:left;transform:scaleX(var(--p,0))}

/* menu sheet */
.sheet{position:fixed;inset:0;z-index:100;background:var(--bark) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/bark.svg');color:var(--lime);padding:120px 24px 40px;display:flex;flex-direction:column;gap:30px;overflow-y:auto;opacity:0;transition:opacity .3s}
.sheet[hidden]{display:none}
.sheet.open{opacity:1}
.sheet .moss{height:130px}
.sheet .moss{color:#B9C3AC}
.sheet-x{position:absolute;top:14px;right:14px;width:48px;height:48px;border:0;background:var(--orange);clip-path:var(--hexclip);cursor:pointer;z-index:4}
.sheet-x span{position:absolute;left:13px;right:13px;top:23px;height:3px;background:var(--bark-d);transform:rotate(45deg)}
.sheet-x span+span{transform:rotate(-45deg)}
.sheet-nav{display:flex;flex-direction:column;position:relative;z-index:4}
.sheet-nav a{font-family:var(--disp);font-weight:700;font-size:clamp(30px,9vw,44px);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;padding:10px 0 6px;border-bottom:1px solid rgba(169,183,154,.25);display:flex;align-items:baseline;gap:14px}
.sheet-nav small{font-size:13px;color:var(--orange);letter-spacing:.2em}
.sheet-cta{display:grid;gap:12px}
.sheet-rate{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--sage)}
body.lock{overflow:hidden}

/* rope gauge (scroll progress) */
.gauge{display:none}
@media (min-width:1240px){
  .gauge{display:block;position:fixed;right:14px;top:calc(var(--hdr) + 40px);bottom:50px;width:96px;z-index:40;pointer-events:none}
  .gauge-rope{position:absolute;right:6px;top:0;bottom:0;width:4px;background:var(--rope);border-radius:2px;opacity:.85}
  .gauge-knot{position:absolute;left:50%;top:calc(var(--p,0)*100%);width:18px;height:20px;margin:-10px 0 0 -9px;background:var(--bark);clip-path:var(--hexclip);box-shadow:none}
  .gauge-knot::after{content:"";position:absolute;inset:4px 4px;background:var(--orange);clip-path:var(--hexclip)}
  .gauge ol{position:absolute;right:16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
  .gauge li{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bark);background:rgba(244,241,232,.88);padding:4px 7px 2px;opacity:.0;transform:translateX(8px);transition:opacity .4s,transform .4s}
  .gauge li.on{opacity:1;transform:none;background:var(--orange);color:var(--bark-d)}
  .gauge:hover li{opacity:1}
}

/* ---------- reveal ---------- */
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .95s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none}

/* ---------- shared type ---------- */
.h-big{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(46px,7.4vw,112px);line-height:.9;letter-spacing:.01em;color:var(--bark)}
.h-big span{display:block}
.h-big .ol{color:var(--olive)}
.tag{position:relative;display:inline-flex;align-items:center;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;background:var(--olive-d);color:var(--lime);padding:10px 16px 7px 24px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);margin-bottom:26px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);position:absolute;left:12px;top:50%;margin-top:-3px}
.photo-note{font-size:12.5px;line-height:1.4;color:rgba(244,241,232,.86);margin:0}
.photo-note.dark{color:var(--muted)}

/* ---------- HERO / canopy ---------- */
.hero{position:relative;z-index:3;min-height:max(860px,100svh);padding:calc(var(--hdr) + 120px) 0 70px;background:linear-gradient(180deg,var(--sky) 0%,#DCE9E6 48%,var(--lime) 100%);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex.svg');opacity:.55;-webkit-mask:linear-gradient(180deg,transparent 30%,#000);mask:linear-gradient(180deg,transparent 30%,#000);z-index:-1}
.moss-top{top:var(--hdr);height:clamp(90px,10vw,150px);z-index:2}
.hero-photo{position:absolute;right:-5vw;top:calc(var(--hdr) + 56px);width:min(53vw,830px);aspect-ratio:100/115.47;z-index:1}
.hex{clip-path:var(--hexclip);overflow:hidden}
.hex img{width:100%;height:100%;object-fit:cover;filter:var(--grade);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.hex-hero{position:absolute;inset:0;animation:hexIn 1.5s cubic-bezier(.2,.75,.2,1) both}
.hex-hero img{object-position:50% 30%}
@keyframes hexIn{from{transform:rotate(-30deg) scale(.82);opacity:0}to{transform:none;opacity:1}}
.hex-block{position:absolute;inset:0;transform:translate(-9%,7%) scale(.92);clip-path:var(--hexclip);background:var(--olive) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex-light.svg');animation:hexIn 1.7s .15s cubic-bezier(.2,.75,.2,1) both}
.hex-line{position:absolute;inset:-5%;width:110%;height:110%;fill:none;stroke:var(--orange);stroke-width:.55;transform:rotate(7deg);animation:lineIn 2s .3s cubic-bezier(.2,.75,.2,1) both}
@keyframes lineIn{from{transform:rotate(-40deg);opacity:0}to{transform:rotate(7deg);opacity:1}}
.hero-rope{position:absolute;left:44%;top:calc(-1*(var(--hdr) + 56px));width:26px;height:calc(var(--hdr) + 56px + 27%);z-index:2;overflow:visible;transform-origin:top;animation:drop 1.6s .5s cubic-bezier(.3,.7,.2,1) both}
.hero-rope path{fill:none;stroke:var(--orange);stroke-width:6;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hero-rope path.tw{stroke:#A94B0C;stroke-width:6;stroke-dasharray:2 5}
@keyframes drop{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.moss-hero{top:-56px;left:-14%;width:128%;height:clamp(260px,30vw,440px)}
.spin-badge{position:absolute;left:-60px;bottom:14%;width:168px;height:168px;z-index:4}
.spin-badge svg{width:100%;height:100%;animation:spin 38s linear infinite}
.sb-hex{fill:var(--bark)}
.spin-badge text{font-family:var(--disp);font-weight:700;font-size:13.4px;letter-spacing:2.4px;fill:var(--lime)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-cap{position:absolute;right:16%;bottom:9%;z-index:4;margin:0;max-width:230px;background:var(--bark);color:var(--lime);font-size:13px;line-height:1.4;padding:11px 16px 11px 18px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.hero-copy{position:relative;z-index:5;max-width:calc(var(--max) + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
.hero-copy>*{max-width:min(54vw,700px)}
.rate-chip{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid rgba(59,47,37,.18);border-radius:999px;padding:9px 18px 7px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--bark);margin-bottom:26px}
.rate-chip b{font-size:16px;letter-spacing:.04em}
.rate-chip:hover{border-color:var(--orange)}
.h-hero{font-family:var(--disp);font-weight:700;text-transform:uppercase;color:var(--bark);line-height:.86;margin:0 0 30px}
.h-hero span{display:block}
.h-hero .l1{font-size:clamp(24px,3.2vw,48px);letter-spacing:.34em}
.h-hero .l2{position:relative;font-size:clamp(92px,15vw,224px);color:var(--olive);letter-spacing:-.005em;line-height:.8;margin:.04em 0 0;padding-top:.08em}
.h-hero .l3{font-size:clamp(36px,5.4vw,80px);letter-spacing:.07em;margin-top:clamp(26px,3.4vw,50px)}
.moss-oaks{top:84%;left:-1%;width:80%;height:clamp(30px,3.6vw,52px);z-index:-1}
.lead{font-size:clamp(17px,1.35vw,19.5px);color:#3E352C;max-width:540px!important}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 26px}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px 20px}
.hero-tags li{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--olive-d)}
.hero-tags li::before{content:"";width:10px;height:11.5px;background:var(--olive);clip-path:var(--hexclip)}

/* ---------- WORK / limbs ---------- */
.work{position:relative;z-index:1;background:var(--lime) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex.svg');padding:clamp(150px,13vw,190px) 0 130px}
.work-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:60px;align-items:start}
.work-head{position:sticky;top:calc(var(--hdr) + 50px)}
.work-head .h-big{margin-bottom:28px;font-size:clamp(50px,7.4vw,106px)}
.work-head p{max-width:400px}
.swipe-hint{display:none}
.comb{--hw:310px;--rs:calc(var(--hw)*.866 + 12px);position:relative;height:calc(2*var(--rs) + var(--hw)*1.1547);width:calc(2.5*var(--hw) + 21px);margin-left:auto}
.cell{position:absolute;width:var(--hw);height:calc(var(--hw)*1.1547)}
.c1{left:calc(var(--hw)*.5 + 7px);top:0}
.c2{left:calc(var(--hw)*1.5 + 21px);top:0}
.c3{left:0;top:var(--rs)}
.c4{left:calc(var(--hw) + 14px);top:var(--rs)}
.c5{left:calc(var(--hw)*.5 + 7px);top:calc(2*var(--rs))}
.c6{left:calc(var(--hw)*1.5 + 21px);top:calc(2*var(--rs))}
.hx{position:absolute;inset:0;background:var(--bark)}
.hx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,26,18,0) 22%,rgba(36,26,18,.58) 46%,rgba(36,26,18,.9) 78%)}
.hx-stump{background:#2F251C}
.hx-stump::after{background:linear-gradient(180deg,rgba(36,26,18,0) 30%,rgba(36,26,18,.7) 58%,rgba(36,26,18,.92) 80%)}
.hx-stump .stump{position:absolute;left:50%;top:6%;width:62%;transform:translateX(-50%)}
.cell-txt{position:absolute;left:0;right:0;top:40%;bottom:21%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 30px;color:var(--lime);pointer-events:none}
.cell-txt .n{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.24em;color:var(--orange);margin-bottom:6px}
.cell-txt h3{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.08;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.cell-txt p{font-size:14px;line-height:1.42;margin:0;color:#EEE9DC}
.cell:hover .hx img{transform:scale(1.08)}
.js .cell .hx{opacity:0;transform:rotate(-30deg) scale(.72);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.75,.2,1);transition-delay:var(--d,0s)}
.js .cell .cell-txt{opacity:0;transition:opacity .7s ease;transition-delay:calc(var(--d,0s) + .45s)}
.js .cell.in .hx{opacity:1;transform:none}
.js .cell.in .cell-txt{opacity:1}
.cta-cell a{position:absolute;inset:0;clip-path:var(--hexclip);background:var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--bark-d);padding:0 40px;transition:background .3s}
.cta-cell a::before{content:"";position:absolute;inset:10px;clip-path:var(--hexclip);border:0;background:transparent;box-shadow:inset 0 0 0 2px var(--bark-d)}
.cta-cell b{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 8px}
.cta-cell span{font-size:14.5px;line-height:1.4;font-weight:600}
.cta-cell svg{width:34px;height:34px}
.cta-cell a:hover{background:#FF8838}
.cta-ring{position:absolute;inset:10px;pointer-events:none}
.cta-ring polygon{fill:none;stroke:var(--bark-d);stroke-width:1;stroke-dasharray:3 3}

/* ---------- CLIMB / trunk ---------- */
.climb{position:relative;z-index:2;background:var(--bark) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/bark.svg');color:var(--lime);padding:clamp(150px,13vw,210px) 0 0}
.climb-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.climb-bg img{width:100%;height:100%;object-fit:cover;opacity:.13;filter:grayscale(1) contrast(1.1);-webkit-mask:linear-gradient(180deg,#000 0%,transparent 70%);mask:linear-gradient(180deg,#000 0%,transparent 70%)}
.climb-grid{position:relative;z-index:2;max-width:none;padding:0;display:grid;grid-template-columns:34vw 64px minmax(0,1fr) 31vw;column-gap:clamp(20px,3vw,46px);align-items:start}
.cp{position:relative}
.cp img{width:100%;height:auto;filter:var(--grade)}
.cp-1{grid-column:1;grid-row:1}
.cp-1 img{clip-path:polygon(0 0,calc(100% - 96px) 0,100% 56px,100% 100%,0 100%);aspect-ratio:4/5.1;object-fit:cover}
.cp-2{grid-column:4;grid-row:1;margin-top:clamp(240px,24vw,360px);margin-bottom:-220px;translate:0 clamp(300px,27vw,400px);z-index:3}
.cp-2 img{clip-path:polygon(96px 0,100% 0,100% calc(100% - 56px),calc(100% - 96px) 100%,0 100%,0 56px);aspect-ratio:3/4;object-fit:cover}
.cp figcaption{position:absolute;left:16px;bottom:16px;max-width:min(78%,330px);background:rgba(36,26,18,.9);color:#EEE9DC;font-size:13.5px;line-height:1.4;padding:10px 14px}
.cp-2 figcaption{left:auto;right:16px;bottom:72px}
.cp figcaption b{display:block;font-family:var(--disp);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--orange);margin-bottom:2px}
.climb-rope{grid-column:2;grid-row:1;align-self:stretch;position:relative;margin-top:calc(-1*clamp(150px,13vw,210px));min-height:100%}
.climb-rope::before{content:"";position:absolute;left:50%;top:0;bottom:-260px;width:9px;margin-left:-4.5px;background:var(--rope);border-radius:5px;box-shadow:2px 0 0 rgba(0,0,0,.25)}
.crab{position:sticky;top:45vh;display:block;width:40px;height:64px;margin:200px auto 0;z-index:2}
.crab svg{width:40px;height:64px}
.climb-copy{grid-column:3;grid-row:1;padding-top:10px}
.h-climb{font-family:var(--disp);font-weight:700;text-transform:uppercase;line-height:.86;margin-bottom:34px}
.h-climb .s{display:block;font-size:clamp(20px,2.3vw,34px);letter-spacing:.14em;color:var(--sage);margin-bottom:14px}
.h-climb .b{display:block;font-size:clamp(68px,8.4vw,128px);color:var(--orange);letter-spacing:.005em}
.climb-copy p{color:#E7E1D2;max-width:480px}
.kit{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.kit li{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);border:1px solid rgba(169,183,154,.35);padding:8px 14px 6px 8px;border-radius:999px}
.kit svg{width:30px;height:30px;color:var(--sage);flex:none}
.climb-giant{position:relative;z-index:1;margin:-40px 0 0;font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(120px,27vw,420px);line-height:.78;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1.5px rgba(201,209,189,.32);padding-left:3vw;white-space:nowrap;user-select:none}

/* ---------- GROUND / clean-up ---------- */
.ground{position:relative;z-index:1;background:var(--lime) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex.svg');padding:clamp(170px,15vw,240px) 0 140px}
.ground-head{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-bottom:60px}
.ground-head>*{max-width:min(62vw,820px)}
.ground-head p{max-width:560px;font-size:18px}
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;padding-right:var(--pad);align-items:start}
.mz{position:relative}
.mz img{width:100%;height:100%;object-fit:cover;filter:var(--grade);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}

.mz-1{grid-column:1/9;grid-row:1;aspect-ratio:16/9;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 60px),calc(100% - 104px) 100%,0 100%)}
.mz-2{grid-column:8/13;grid-row:1/3;margin-top:90px;z-index:2;aspect-ratio:4/5;clip-path:polygon(84px 0,100% 0,100% 100%,0 100%,0 48px)}
.mz-3{grid-column:1/5;grid-row:2/4;margin-top:-110px;z-index:3;aspect-ratio:4/5;background:var(--lime);padding:12px}
.mz-4{grid-column:5/8;grid-row:2/4;margin-top:30px;aspect-ratio:2/3;overflow:hidden;clip-path:polygon(0 0,calc(100% - 70px) 0,100% 40px,100% 100%,0 100%)}
.mz:hover img{transform:scale(1.05)}
.mz-2,.mz-3{overflow:hidden}
.mosaic .mz-1 figcaption{bottom:auto;top:22px}
.mz figcaption{position:absolute;left:24px;bottom:22px;z-index:2;display:flex;align-items:center;gap:10px;max-width:calc(100% - 48px);background:rgba(36,26,18,.9);color:#EEE9DC;font-size:13.5px;line-height:1.35;padding:8px 14px 8px 8px}
.mz figcaption span{flex:none;display:grid;place-items:center;width:28px;height:32px;clip-path:var(--hexclip);background:var(--orange);color:var(--bark-d);font-family:var(--disp);font-weight:700;font-size:14px;padding-top:2px}
.stump-card{grid-column:8/12;grid-row:3;margin-top:40px;background:var(--bark);color:var(--lime);padding:34px 34px 30px;clip-path:polygon(0 0,calc(100% - 64px) 0,100% 37px,100% 100%,64px 100%,0 calc(100% - 37px));position:relative}
.stump-hex{width:110px;margin:-6px 0 14px}
.stump-hex svg{width:100%;height:auto}
.stump-card h3{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.stump-card p{margin:0;font-size:15.5px;color:#E7E1D2}

/* ---------- OAKS banner ---------- */
.oaks{position:relative;z-index:1;min-height:min(900px,100svh);display:flex;align-items:flex-end;color:var(--lime);isolation:isolate;overflow:hidden}
.oaks-photo{position:absolute;inset:0;z-index:-2}
.oaks-photo img{width:100%;height:100%;object-fit:cover;filter:var(--grade) brightness(.86)}
.oaks::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(36,26,18,.5) 0%,rgba(36,26,18,.05) 34%,rgba(36,26,18,.35) 58%,rgba(36,26,18,.9) 100%)}
.oaks-in{position:static;width:100%;padding:150px var(--pad) 110px}
.oaks-kick{font-family:var(--disp);font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(13px,1.2vw,17px);color:var(--sage-l);margin-bottom:10px}
.oaks-word{font-family:var(--disp);font-weight:700;text-transform:uppercase;margin:0;position:relative}
.ow-1{display:block;font-size:min(13.6vw,232px);line-height:.8;letter-spacing:-.005em;color:var(--lime);text-shadow:0 6px 40px rgba(36,26,18,.35);padding-top:.06em}
.moss-word{position:relative;display:block;height:clamp(80px,12vw,200px);margin-top:-1.2vw;z-index:1}
.moss-word{color:#D6DCCB}
.ow-2{display:block;margin-top:clamp(-120px,-6vw,-40px);position:relative;z-index:2;font-size:clamp(18px,2.6vw,40px);letter-spacing:.36em;color:var(--orange);text-shadow:0 2px 18px rgba(36,26,18,.6)}
.moss-tag{position:absolute;right:calc(var(--pad) + 60px);top:0;width:300px;z-index:3;transform-origin:50% 0;animation:pend 6s ease-in-out infinite alternate}
.moss-tag-str{display:block;width:2px;height:150px;margin:0 auto;background:#D9DCCD}
.moss-tag p{background:var(--lime);color:var(--ink);font-size:14.5px;line-height:1.5;padding:22px 22px 20px;margin:0;clip-path:polygon(50% 0,100% 14%,100% 100%,0 100%,0 14%);padding-top:44px;position:relative}
.moss-tag b{display:block;font-family:var(--disp);letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--olive-d);margin-bottom:4px}
@keyframes pend{from{transform:rotate(-2.2deg)}to{transform:rotate(2deg)}}
.oaks>.photo-note{position:absolute;right:18px;bottom:14px}

/* ---------- CONTACT ---------- */
.contact{position:relative;z-index:1;background:var(--sky) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex.svg');padding:clamp(150px,14vw,220px) 0 140px}
.contact-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 50px;margin-bottom:50px}
.contact-top .h-big{font-size:clamp(46px,8vw,124px)}
.contact-top .h-big span{display:inline}
.contact-top p{max-width:420px;margin:0;font-size:17.5px}
.contact-grid{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1.35fr);gap:clamp(24px,3vw,48px);align-items:start}
.contact-grid .form{grid-column:3;grid-row:1/3}
.steps{grid-column:1/3;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--bark);color:#E7E1D2;padding:30px 26px 26px;position:relative;clip-path:polygon(0 0,100% 0,100% 100%,56px 100%,0 calc(100% - 32px))}
.steps::before{content:"";position:absolute;left:46px;right:46px;top:51px;height:6px;background:var(--rope-h);border-radius:3px}
.steps li{position:relative;padding:0 14px;font-size:14.5px;line-height:1.45}
.steps b{display:block;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:12px 0 4px}
.st-n{position:relative;display:grid;place-items:center;width:42px;height:48px;background:var(--orange);color:var(--bark-d);clip-path:var(--hexclip);font-family:var(--disp);font-weight:700;font-size:18px;padding-top:3px}
.rate-hex{position:relative;width:100%;max-width:270px;aspect-ratio:100/115.47;color:var(--lime)}
.rate-shape{position:absolute;inset:0;width:100%;height:100%;fill:var(--olive-d)}
.js .rate-hex.reveal .rate-shape{transform:rotate(-60deg) scale(.8);transition:transform 1.2s cubic-bezier(.2,.75,.2,1) .1s}
.js .rate-hex.reveal.in .rate-shape{transform:none}
.rate-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rate-in .stars{width:118px;height:21px;margin-bottom:12px}
.rate-num{font-family:var(--disp);font-weight:700;font-size:96px;line-height:.8;margin:0;padding-top:.1em}
.rate-lbl{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:10px 0 12px}
.rate-in a{font-size:14.5px;font-weight:700;color:var(--lime);text-underline-offset:4px}
.rate-in a:hover{color:#FFD2B3}
.lines li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1.5px dashed rgba(59,47,37,.22)}
.lines li:first-child{padding-top:0}
.li-hex{flex:none;display:grid;place-items:center;width:44px;height:50px;background:var(--bark);clip-path:var(--hexclip);color:var(--lime)}
.li-hex svg{width:20px;height:20px}
.lines li>span:last-child{display:flex;flex-direction:column;min-width:0;font-weight:700;font-size:16px;line-height:1.35;color:var(--bark)}
.lines small{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#4A5631;margin-bottom:3px}
.lines a{text-decoration:none}
.lines a:hover{color:var(--orange-d);text-decoration:underline}
.form{position:relative;background:var(--lime);padding:46px clamp(22px,3vw,42px) 34px clamp(40px,4vw,62px);clip-path:polygon(0 0,calc(100% - 72px) 0,100% 42px,100% 100%,0 100%)}
.moss-form{left:auto;right:30px;width:220px;height:120px;z-index:0}
.form-rope{position:absolute;left:16px;top:0;bottom:0;width:8px;background:var(--rope);border-radius:4px}
.form>*:not(.moss):not(.form-rope){position:relative;z-index:1}
.form-h{font-family:var(--disp);font-weight:700;font-size:clamp(24px,2.3vw,32px);letter-spacing:.04em;text-transform:uppercase;color:var(--bark);padding-top:4px}
.form-sub{font-size:15px;color:var(--muted);margin:6px 0 20px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span,.chips legend{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#4E4236}
.fld i{font-style:normal;text-transform:none;letter-spacing:.02em;font-weight:600;color:var(--muted)}
.fld input,.fld textarea{width:100%;min-height:50px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid #CBC2AC;border-left:4px solid var(--sage);border-radius:0;padding:11px 14px}
.fld textarea{resize:vertical;min-height:110px}
.fld input:focus,.fld textarea:focus{outline:3px solid var(--orange);outline-offset:1px;border-color:var(--olive)}
.chips{border:0;padding:0;margin:4px 0 16px;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{padding:0;margin-bottom:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px 2px;border:1.5px solid #B9AF98;border-radius:999px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--paper);transition:background .2s,color .2s}
.chips input:checked+span{background:var(--olive-d);border-color:var(--olive-d);color:var(--lime)}
.chips input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.form-go{width:100%;margin-top:6px}
.form-err{color:#9B2C0B;font-weight:700;font-size:15px;margin:0 0 8px}
.form-fine{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.form-fine a{color:var(--bark);font-weight:700}

/* ---------- FAQ ---------- */
.faq{position:relative;z-index:1;background:var(--lime);padding:clamp(150px,13vw,210px) 0 150px;min-height:calc(min(46vw,700px)*1.1547 + clamp(150px,12vw,200px) + 120px)}
.faq-photo{position:absolute;left:-7vw;top:clamp(150px,12vw,200px);width:min(46vw,700px)}
.faq-photo .hex{aspect-ratio:100/115.47}
.faq-photo .hex img{filter:var(--grade) saturate(.9)}
.faq-photo .photo-note{margin:14px 0 0 9vw}
.faq-grid{display:flex;justify-content:flex-end}
.faq-list{width:min(700px,54%)}
.faq-list .h-big{margin-bottom:36px;font-size:clamp(46px,6.6vw,100px)}
.faq details{border-top:1.5px solid rgba(59,47,37,.18)}
.faq details:last-child{border-bottom:1.5px solid rgba(59,47,37,.18)}
.faq summary{list-style:none;display:flex;align-items:center;gap:18px;padding:22px 0 20px;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:clamp(18px,1.7vw,23px);line-height:1.25;color:var(--bark)}
.faq summary::-webkit-details-marker{display:none}
.q-hex{position:relative;flex:none;width:36px;height:41px;background:var(--olive);clip-path:var(--hexclip);transition:transform .45s,background .3s}
.q-hex::before,.q-hex::after{content:"";position:absolute;left:11px;right:11px;top:19px;height:3px;background:var(--lime)}
.q-hex::after{transform:rotate(90deg);transition:transform .45s}
.faq details[open] .q-hex{background:var(--orange);transform:rotate(60deg)}
.faq details[open] .q-hex::after{transform:rotate(0)}
.faq summary:hover{color:var(--olive-d)}
.ans{padding:0 0 22px 54px;position:relative}
.ans::before{content:"";position:absolute;left:15px;top:0;bottom:24px;width:6px;background:var(--rope);border-radius:3px}
.ans p{margin:0;max-width:60ch;color:#3E352C}
.ans a{color:var(--bark);font-weight:700}

/* ---------- FOOTER ---------- */
.ftr{position:relative;background:var(--bark) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/bark.svg');color:#E7E1D2;padding:0 0 40px;overflow:hidden}
.ftr-oak{height:clamp(240px,30vw,440px);background:linear-gradient(180deg,var(--lime) 0%,#DDE5D6 26%,#9EAA8F 62%,var(--bark) 100%)}
.oak{width:100%;height:100%;display:block}
.oak-wood{fill:#2B2A1F;stroke:#2B2A1F}
.oak-crown{fill:#2B2A1F}
.oak-moss path{fill:none;stroke:#8C977E;stroke-width:1.5;stroke-linecap:round;stroke-opacity:.85}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1.25fr .9fr;gap:40px;padding-top:30px;position:relative;z-index:2}
.brand-l .brand-mark{width:48px;height:54px}
.ftr-brand p{max-width:340px;margin:18px 0;font-size:15.5px}
.ftr-cta{margin-bottom:16px}
.ftr-rate{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;color:var(--sage)}
.ftr-col h2{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange);margin:6px 0 16px}
.ftr-col li{margin-bottom:9px;font-size:15.5px}
.ftr-col a{text-decoration:none;color:#E7E1D2}
.ftr-col a:hover{color:var(--orange);text-decoration:underline}
.ftr-lines li{display:flex;align-items:center;gap:10px}
.ftr-lines svg{width:18px;height:18px;color:var(--sage);flex:none}
.ftr-logo{margin-top:18px;display:flex;align-items:center;gap:12px}
.ftr-logo img{width:76px;height:76px;clip-path:var(--hexclip);object-fit:cover}
.ftr-logo figcaption{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
.ftr-giant{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:11.4vw;line-height:.8;letter-spacing:.02em;text-align:center;white-space:nowrap;color:transparent;-webkit-text-stroke:1.2px rgba(201,209,189,.35);margin:60px 0 30px;padding-top:.08em;user-select:none}
.ftr-base{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px 40px;align-items:center;border-top:1px solid rgba(169,183,154,.28);padding-top:22px;font-size:13.5px;color:#D4CCBA}
.ftr-base p{margin:0}
.ftr-photos{max-width:680px}
.up{display:inline-flex;align-items:center;gap:8px;color:var(--orange);font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;font-size:12.5px}
.up svg{transform:rotate(-90deg)}

/* ---------- hexagon cursor ---------- */
.cur{position:fixed;left:0;top:0;z-index:300;pointer-events:none;width:0;height:0;opacity:0;transition:opacity .2s}
.cur.on{opacity:1}
.cur::before{content:"";position:absolute;left:-9px;top:-10px;width:18px;height:20px;background:var(--orange);clip-path:var(--hexclip);transition:transform .25s cubic-bezier(.2,.7,.2,1),opacity .25s;opacity:.9}
.cur.big::before{transform:scale(2.6) rotate(30deg);opacity:.35}
.work-cta{margin:26px 0 0}

/* ---------- phone dock ---------- */
.dock{display:none}

/* ---------- legal pages ---------- */
.legal-hero{position:relative;background:var(--sky) url('https://work.sanketchaukiyal.com/cerroblanco-tree/images/hex.svg');padding:calc(var(--hdr) + 150px) 0 70px}
.legal-hero .moss{top:var(--hdr)}
.legal{background:var(--lime);padding:0 0 120px}
.legal-in{max-width:960px}
.legal-body{background:var(--paper);margin-top:-30px;position:relative;padding:clamp(26px,5vw,60px);clip-path:polygon(0 0,calc(100% - 64px) 0,100% 37px,100% 100%,0 100%);border-left:8px solid var(--orange)}
.legal-body h2{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:var(--bark);margin:30px 0 10px}
.legal-body p,.legal-body li{font-size:16.5px;line-height:1.7}
.legal-body ul{list-style:disc;padding-left:22px;margin-bottom:1em}
.legal-body a{color:var(--olive-d);font-weight:700;overflow-wrap:anywhere}

/* ---------- 404 ---------- */
.nf{position:relative;min-height:100vh;background:linear-gradient(180deg,var(--sky),#DCE9E6 60%,var(--lime));overflow:hidden;display:flex;align-items:center}
.nf .moss-hero{top:0;left:0;width:100%;height:clamp(200px,28vw,380px)}
.nf-in{position:relative;z-index:4;max-width:820px;margin:0 auto;padding:clamp(150px,18vw,230px) var(--pad) 80px}
.nf .brand{color:var(--bark);margin-bottom:26px}
.nf .brand-tag{color:var(--olive-d)}
.nf-num{display:flex;align-items:center;gap:.06em;font-family:var(--disp);font-weight:700;font-size:clamp(110px,21vw,250px);line-height:.8;color:var(--olive);margin:0 0 20px;padding-top:.08em}
.nf-stump{height:.95em;width:auto;margin-top:-.08em}
.nf .h-big{font-size:clamp(40px,6vw,84px);margin-bottom:20px}
.nf-rope{position:absolute;left:8%;top:0;width:9px;height:62%;background:var(--rope);border-radius:5px;z-index:3}
.nf-rope::after{content:"";position:absolute;left:-12px;bottom:-30px;width:33px;height:38px;background:var(--orange);clip-path:var(--hexclip)}

/* =========================================================
   Tablet
   ========================================================= */
@media (max-width:1180px){
  .nav{display:none}
  .burger{display:block;margin-left:0}
  .hdr-call{margin-left:auto}
  .work-grid{grid-template-columns:1fr;gap:40px}
  .work-head{position:static}
  .comb{margin:0 auto}
  .contact-grid{grid-template-columns:240px minmax(0,1fr)}
  .contact-grid .form{grid-column:1/-1;grid-row:auto}
  .steps{grid-column:1/-1;grid-row:auto}
  .ftr-grid{grid-template-columns:1fr 1fr}
}

/* =========================================================
   Phone: composed on its own
   ========================================================= */
@media (max-width:760px){
  :root{--hdr:64px}
  body{font-size:16.5px;padding-bottom:62px}
  .brand-name{font-size:16px;letter-spacing:.2em}
  .brand-tag{font-size:9.5px;letter-spacing:.14em}
  .brand-mark{width:34px;height:38px}
  .hdr-call{display:none}
  .burger{margin-left:auto}

  .dock{display:grid;grid-template-columns:1fr 1.25fr;position:fixed;left:0;right:0;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom);background:var(--bark)}
  .dock a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding-top:3px}
  .dock-call{background:var(--orange);color:var(--bark-d)}
  .dock-text{background:var(--olive-d);color:var(--lime)}

  /* hero: photo first, headline climbs over its lower corner */
  .hero{min-height:0;padding:calc(var(--hdr) + 18px) 0 70px}
  .moss-top{display:none}
  .hero-photo{position:relative;right:auto;top:auto;width:100vw;margin:0 -16vw 0 auto;max-width:none}
  .hex-block{transform:translate(-10%,6%) scale(.9)}
  .hero-rope{left:44%;top:calc(-1*(var(--hdr) + 18px));height:calc(var(--hdr) + 18px + 27%)}
  .moss-hero{top:calc(-1*18px);left:-10%;width:120%;height:200px}
  .spin-badge{width:104px;height:104px;left:20%;right:auto;top:2%;bottom:auto}
  .hero-cap{display:none}
  .hero-copy{margin-top:-30vw}
  .hero-copy>*{max-width:100%}
  .rate-chip{margin-bottom:18px}
  .h-hero{margin-bottom:24px}
  .h-hero .l1{font-size:20px;letter-spacing:.2em;display:inline-block;background:rgba(244,241,232,.9);padding:6px 10px 2px;margin-left:-10px}
  .h-hero .l2{font-size:clamp(84px,24vw,120px)}
  .h-hero .l3{font-size:clamp(32px,9.6vw,46px);margin-top:28px}
  .moss-oaks{height:34px;width:70%}
  .cta-row{flex-direction:column;margin:24px 0 22px}
  .cta-row .pill{width:100%;font-size:14px;letter-spacing:.06em;padding:3px 18px 0}

  /* services: swipe through the honeycomb */
  .work{padding:130px 0 90px}
  .work-head .h-big{font-size:clamp(50px,15vw,72px)}
  .swipe-hint{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive-d);margin:6px 0 0}
  .comb{--hw:min(80vw,320px);position:static;height:auto;width:auto;margin:0 calc(-1*var(--pad));padding:6px var(--pad) 18px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .comb::-webkit-scrollbar{display:none}
  .cell{position:relative;left:auto!important;top:auto!important;flex:0 0 var(--hw);scroll-snap-align:center}
  .cell-txt{top:38%;padding:0 26px}
  .cell-txt h3{font-size:18px}

  /* climb */
  .climb{padding-top:110px}
  .climb-grid{grid-template-columns:1fr;padding:0;row-gap:0}
  .climb-copy{grid-column:1;grid-row:1;padding:0 var(--pad) 40px}
  .cp-1{grid-column:1;grid-row:2;width:74vw}
  .cp-2{grid-column:1;grid-row:3;width:64vw;justify-self:end;margin:-38vw 0 -120px;translate:0 0}
  .cp-1 img{clip-path:polygon(0 0,calc(100% - 60px) 0,100% 35px,100% 100%,0 100%)}
  .cp-2 img{clip-path:polygon(60px 0,100% 0,100% calc(100% - 35px),calc(100% - 60px) 100%,0 100%,0 35px)}
  .cp figcaption{left:10px;bottom:10px;font-size:12.5px;max-width:86%}
  .cp-2 figcaption{left:10px;right:auto;bottom:44px}
  .climb-rope{grid-column:1;grid-row:2/4;margin:0;justify-self:end;width:30px;margin-right:12vw;z-index:1}
  .climb-rope::before{top:-40px;bottom:0}
  .crab{margin-top:40px;top:40vh}
  .h-climb .b{font-size:clamp(64px,19vw,96px)}
  .climb-giant{font-size:34vw;margin-top:20px;padding-left:0}

  /* ground */
  .ground{padding:170px 0 90px}
  .ground-head>*{max-width:100%}
  .ground-head .h-big{font-size:clamp(46px,13.4vw,64px)}
  .ground-head{margin-bottom:34px}
  .mosaic{grid-template-columns:repeat(6,minmax(0,1fr));column-gap:10px;padding-right:0}
  .mz-1{grid-column:1/7;grid-row:1;clip-path:polygon(0 0,100% 0,100% calc(100% - 34px),calc(100% - 60px) 100%,0 100%)}
  .mz-2{grid-column:3/7;grid-row:2;margin-top:-40px;padding:8px}
  .mz-3{grid-column:1/4;grid-row:3;margin:-90px 0 0;padding:8px;margin-left:var(--pad)}
  .mz-4{grid-column:4/7;grid-row:3;margin:20px var(--pad) 0 0}
  .mz figcaption{left:12px;bottom:12px;font-size:12px;max-width:calc(100% - 24px);padding:6px 10px 6px 6px}
  .mz-3 figcaption,.mz-4 figcaption{position:static;margin-top:-1px}
  .mz-3,.mz-4{aspect-ratio:auto}
  .mz-3 img{aspect-ratio:4/5;height:auto}
  .mz-4 img{aspect-ratio:2/3;height:auto}
  .mz-4{clip-path:none}
  .mz-4 img{clip-path:polygon(0 0,calc(100% - 44px) 0,100% 26px,100% 100%,0 100%)}
  .mz-3 figcaption,.mz-4 figcaption{background:var(--bark);display:flex}
  .stump-card{grid-column:1/7;grid-row:4;margin:40px var(--pad) 0;padding:28px 24px}

  /* oaks */
  .oaks{min-height:700px}
  .oaks-in{padding:120px var(--pad) 90px}
  .ow-1{font-size:15vw}
  .ow-2{font-size:15px;letter-spacing:.26em;margin-top:-34px}
  .moss-word{height:120px}
  .moss-tag{position:relative;right:auto;top:auto;width:auto;max-width:330px;margin-top:30px;animation:none}
  .moss-tag-str{height:40px;margin-left:40px}
  .moss-tag p{clip-path:polygon(14% 0,100% 0,100% 100%,0 100%,0 8%);padding-top:22px}
  .oaks{flex-direction:column;justify-content:flex-end}

  /* contact */
  .contact{padding:130px 0 90px}
  .contact-top{margin-bottom:30px}
  .contact-top .h-big span{display:block}
  .contact-top .h-big{font-size:clamp(50px,15vw,74px)}
  .contact-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:18px;padding:26px 20px 30px}
  .steps::before{left:40px;right:auto;top:30px;bottom:40px;width:6px;height:auto;background:var(--rope)}
  .steps li{display:grid;grid-template-columns:42px 1fr;column-gap:16px;padding:0}
  .steps .st-n{grid-row:1/3}
  .steps b{margin:4px 0 2px}
  .rate-hex{max-width:230px;margin:0 auto}
  .form{padding:40px 18px 26px 40px;clip-path:polygon(0 0,calc(100% - 50px) 0,100% 30px,100% 100%,0 100%)}
  .form-rope{left:14px;width:7px}
  .f2{grid-template-columns:1fr}
  .moss-form{width:140px;height:90px;right:10px}

  /* faq */
  .faq{padding:120px 0 90px;min-height:0}
  .faq-photo{position:relative;left:auto;top:auto;width:78vw;margin:0 0 36px -10vw}
  .faq-photo .photo-note{margin-left:12vw}
  .faq-list{width:100%}
  .faq-list .h-big{font-size:clamp(46px,13.4vw,64px)}
  .ans{padding-left:52px}

  /* footer */
  .ftr{padding-bottom:30px}
  .ftr-oak{height:210px}
  .ftr-grid{grid-template-columns:1fr;gap:30px}
  .ftr-giant{font-size:10.6vw;margin:40px 0 24px}
  .ftr-base{grid-template-columns:1fr}

  .legal-hero{padding:calc(var(--hdr) + 110px) 0 60px}
  .legal-hero .h-big{font-size:clamp(46px,13vw,64px)}
  .nf-rope{left:10px;right:auto;height:26%;width:7px}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .reveal,.js .cell .hx,.js .cell .cell-txt{opacity:1;transform:none}
  .js .rate-hex.reveal .rate-shape{transform:none}
}
</style>
</head>
